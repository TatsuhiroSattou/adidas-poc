<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
    
    <title>El Legado Vivo y Fe de Carlitos Polanco</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=600;700&family=Montserrat:wght=300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="web-container">
        
        <!-- Menú de Navegación Superior -->
        <nav class="top-nav">
            <button class="nav-btn active" id="btn-inicio">Inicio</button>
            <button class="nav-btn" id="btn-sobre">Sobre Carlitos</button>
            <button class="nav-btn" id="btn-fe">Fe y Esperanza</button>
            <button class="nav-btn" id="btn-recursos">Recursos</button>
            <button class="nav-btn" id="btn-contacto">Contacto</button>
        </nav>

        <!-- Cabecera Principal Fija -->
        <header class="hero-section">
            <div class="hero-titles">
                <p class="uppercase-accent">CELEBRANDO EL LEGADO VIVO Y LA FE DE</p>
                <h1 class="carlitos-title">CARLITOS POLANCO</h1>
                <p class="dates-label">¡Su sueño continúa y su música sigue latiendo hoy!</p>
            </div>
        </header>

        <!-- Contenedor Dinámico Cambiante -->
        <main id="dynamic-content-area" class="main-content-wrapper">
            <!-- JavaScript cargará aquí el Perfil Vivo + Grilla en Inicio, u otras pestañas limpias -->
        </main>

        <!-- Ventana Modal para Tarjetas -->
        <div id="secure-app-modal" class="modal-overlay" aria-hidden="true" role="dialog">
            <div class="modal-card-box">
                <span class="modal-close-cross" id="cerrar-modal">&times;</span>
                <div id="modal-secure-payload"></div>
            </div>
        </div>

        <!-- Footer Oficial -->
        <footer class="site-footer">
            <p>© Copyright 2026 - All Rights Reserved.</p>
            <p class="sub-footer-text">Un mensaje de fe, adoración y un sueño que sigue creciendo.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
